<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronunciation audit — Poké Learning</title>
<!--
  Dev tool, not part of the app.

  For each name it can play "Before" (the real spelling, what the synthesiser
  does unaided) and "After" (whatever respelling is in the box), plus A/B to
  hear them back to back. The box is editable, so a fix can be tried by ear on
  the spot rather than guessed at — an edited value is collected in the output
  list at the bottom, ready to paste back and drop into SPEECH_OVERRIDES.

  It reads POKEMON and SPEECH_OVERRIDES out of ../index.html via a hidden iframe
  rather than keeping its own copy, so it can never drift out of sync with the
  real roster. That means it has to be served over http:// — a file:// iframe is
  treated as a different origin and blocked. Either open it on the live site, or
  from the repo root run `python3 -m http.server 8899` and visit
  http://localhost:8899/tools/pronounce.html

  Flags and edits are saved to localStorage, so a pass can be done in sittings.
  Voices come from the device, not the app — audit on the device actually used.
-->
<style>
  :root{ --ink:#3f3d36; --soft:#7b776c; --line:#e6e2d6; --bg:#fbf9f3; --accent:#4e9d63; --bad:#d8574f; --edit:#c98a1e; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header{ position:sticky; top:0; background:var(--bg); border-bottom:2px solid var(--line); padding:12px 14px; z-index:2; }
  h1{ margin:0 0 9px; font-size:1.1rem; }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=search], select, input.try{ font:inherit; padding:7px 10px; border:2px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); }
  input[type=search]{ flex:1; min-width:150px; }
  .count{ color:var(--soft); font-size:.86rem; font-weight:400; }
  ul{ list-style:none; margin:0; padding:0 14px 250px; }
  li{ padding:10px 4px; border-bottom:1px solid var(--line); }
  li.flagged{ background:#fdecea; }
  li.edited{ background:#fff7e8; }
  .help{ margin:8px 0 0; font-size:.85rem; color:var(--soft); max-width:70ch; }
  .help b{ color:var(--ink); }
  /* A row whose box still holds the plain name has nothing to compare against —
     Before and After would speak identical text. Say so rather than letting the
     buttons look live and produce the same sound twice. */
  button:disabled{ opacity:.4; cursor:default; border-color:var(--line); }
  .same{ font-size:.78rem; color:var(--soft); font-style:italic; }
  .top{ display:flex; align-items:center; gap:10px; margin-bottom:7px; }
  .id{ color:var(--soft); font-variant-numeric:tabular-nums; font-size:.8rem; min-width:50px; }
  .nm{ font-weight:700; text-transform:capitalize; font-size:1.02rem; }
  .tag-unverified{ background:#fbe6c4; color:#8a5a12; }
  .tag-checked{ background:#d9efdc; color:#2f6b40; }
  .tag{ font-size:.72rem; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--line); color:var(--soft); }
  .spacer{ flex:1; }
  .row2{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  input.try{ flex:1; min-width:150px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9rem; }
  button{ font:inherit; cursor:pointer; border-radius:9px; border:2px solid var(--line); background:#fff; color:var(--ink); padding:6px 11px; white-space:nowrap; }
  button:hover{ border-color:var(--accent); }
  button.ab{ font-weight:700; }
  button.flag.on{ background:var(--bad); border-color:var(--bad); color:#fff; }
  button.reset{ color:var(--soft); }
  footer{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid var(--line); padding:11px 14px; display:flex; gap:11px; align-items:flex-start; }
  textarea{ flex:1; height:112px; font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; padding:9px; border:2px solid var(--line); border-radius:9px; resize:vertical; }
  .fcol{ display:flex; flex-direction:column; gap:6px; }
  .warn{ padding:16px; color:var(--bad); font-weight:600; }
</style>
</head>
<body>

<header>
  <h1>Pronunciation audit <span class="count" id="progress"></span></h1>
  <p class="help">The box is what the app says. <b>Type a respelling into it</b> to try a fix by ear — <b>▶ After</b> plays whatever is in the box, and it collects at the bottom for me. <b>A/B</b> only lights up once the box differs from the name; until then there is nothing to compare.</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter by name…">
    <!-- Defaults to the respelled set: those are the only rows with something to
         compare, and scrolling 1,021 identical-sounding rows to find 29 is not a
         reasonable opening move. -->
    <select id="show">
      <option value="over" selected>Respelled in the app</option>
      <option value="unver">Unverified guesses</option>
      <option value="todo">Flagged or edited</option>
      <option value="plain">Not respelled</option>
      <option value="all">All names</option>
    </select>
    <select id="voice"><option>Loading voices…</option></select>
  </div>
</header>

<div id="warn" class="warn" hidden></div>
<ul id="list"></ul>

<footer>
  <div class="fcol">
    <button id="copy">Copy list</button>
    <button id="clear">Clear all</button>
  </div>
  <textarea id="out" readonly placeholder="Flag a name as wrong, or type a respelling you like, and it collects here."></textarea>
</footer>

<iframe id="app" src="../index.html" hidden></iframe>

<script>
const FLAG_KEY = "pronounceAuditFlags", EDIT_KEY = "pronounceAuditEdits";
let POKE = [], OVERRIDES = {}, PROV = {}, voices = [], flags = new Set(), edits = {};

const $ = s => document.querySelector(s);
try { flags = new Set(JSON.parse(localStorage.getItem(FLAG_KEY)) || []); } catch(e){}
try { edits = JSON.parse(localStorage.getItem(EDIT_KEY)) || {}; } catch(e){}
const save = () => {
  try{
    localStorage.setItem(FLAG_KEY, JSON.stringify([...flags]));
    localStorage.setItem(EDIT_KEY, JSON.stringify(edits));
  }catch(e){}
};

// What the app would say today: an edit beats an override, an override beats the raw name.
const shipped = n => OVERRIDES[n.toLowerCase()] || n;
const current = n => (n in edits) ? edits[n] : shipped(n);
// Only worth an A/B if the text to speak actually differs from the plain name.
const comparable = n => current(n).trim().toLowerCase() !== n.trim().toLowerCase();

function loadVoices(){
  voices = speechSynthesis.getVoices();
  const sel = $("#voice");
  if(!voices.length){ sel.innerHTML = "<option>No voices installed</option>"; return; }
  const keep = sel.value;
  const preferred = voices.findIndex(v => /^en[-_]US/i.test(v.lang));
  sel.innerHTML = voices.map((v,i) => `<option value="${i}">${v.name} — ${v.lang}${v.localService ? "" : " (network)"}</option>`).join("");
  sel.value = (keep && voices[keep]) ? keep : String(preferred === -1 ? 0 : preferred);
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function utter(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";           // same settings the app uses, so this matches what a kid hears
  u.rate = 0.8;
  u.pitch = 1.1;
  const v = voices[Number($("#voice").value)];
  if(v) u.voice = v;
  return u;
}
function say(text){
  speechSynthesis.cancel();
  speechSynthesis.speak(utter(text));
}
// Before, a beat, then after — the pause matters, the two run together otherwise.
function sayAB(before, after){
  speechSynthesis.cancel();
  const a = utter(before);
  a.onend = () => setTimeout(() => speechSynthesis.speak(utter(after)), 420);
  speechSynthesis.speak(a);
}

function refreshOut(){
  const lines = [];
  for(const p of POKE){
    const edited = (p.n in edits) && edits[p.n] !== shipped(p.n);
    if(edited)            lines.push(`${p.n}: "${edits[p.n]}"`);
    else if(flags.has(p.n)) lines.push(`${p.n}: ?   (currently says "${shipped(p.n)}")`);
  }
  $("#out").value = lines.join("\n");
  const touched = new Set([...flags, ...Object.keys(edits).filter(n => edits[n] !== shipped(n))]);
  $("#progress").textContent = `${touched.size} to fix of ${POKE.length}`;

  // Put the size of each set on its own option — knowing "29" up front is the
  // difference between a short job and an open-ended one.
  const over = POKE.filter(p => OVERRIDES[p.n.toLowerCase()]).length;
  const label = {
    over:  `Respelled in the app (${over})`,
    todo:  `Flagged or edited (${touched.size})`,
    unver: `Unverified guesses (${POKE.filter(p => PROV[p.n] === "unverified").length})`,
    plain: `Not respelled (${POKE.length - over})`,
    all:   `All names (${POKE.length})`,
  };
  for(const opt of $("#show").options) opt.textContent = label[opt.value];
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const mode = $("#show").value;
  const rows = POKE.filter(p => {
    if(q && !p.n.toLowerCase().includes(q)) return false;
    const has = !!OVERRIDES[p.n.toLowerCase()];
    const edited = (p.n in edits) && edits[p.n] !== shipped(p.n);
    if(mode === "over"  && !has) return false;
    if(mode === "plain" && has)  return false;
    if(mode === "unver" && PROV[p.n] !== "unverified") return false;
    if(mode === "todo"  && !flags.has(p.n) && !edited) return false;
    return true;
  });
  $("#list").innerHTML = rows.map(p => {
    const has = !!OVERRIDES[p.n.toLowerCase()];
    const edited = (p.n in edits) && edits[p.n] !== shipped(p.n);
    return `<li data-n="${p.n}" class="${flags.has(p.n) ? "flagged " : ""}${edited ? "edited" : ""}">
      <div class="top">
        <span class="id">#${String(p.id).padStart(4,"0")}</span>
        <span class="nm">${p.n}</span>
        ${has ? `<span class="tag tag-${PROV[p.n]||"override"}">${PROV[p.n]||"override"}</span>` : ""}
        ${edited ? `<span class="tag">edited</span>` : ""}
        <span class="spacer"></span>
        <button class="flag ${flags.has(p.n) ? "on" : ""}">✗ Wrong</button>
      </div>
      <div class="row2">
        <button class="before">▶ ${comparable(p.n) ? "Before" : "Play"}</button>
        <button class="ab" ${comparable(p.n) ? "" : "disabled"} title="Needs a respelling in the box to compare against">A / B</button>
        <input class="try" value="${String(current(p.n)).replace(/"/g,"&quot;")}" spellcheck="false">
        <button class="after" ${comparable(p.n) ? "" : "disabled"}>▶ After</button>
        <button class="reset" title="Undo your edit">↺</button>
        ${comparable(p.n) ? "" : `<span class="same">no respelling yet — type one to hear a difference</span>`}
      </div>
    </li>`;
  }).join("");
}

$("#list").addEventListener("click", e => {
  const li = e.target.closest("li");
  if(!li) return;
  const name = li.dataset.n;
  const box = li.querySelector(".try");
  if(e.target.classList.contains("before"))      say(name);              // the raw spelling, unaided
  else if(e.target.classList.contains("after"))  say(box.value);
  else if(e.target.classList.contains("ab"))     sayAB(name, box.value);
  else if(e.target.classList.contains("flag")){
    flags.has(name) ? flags.delete(name) : flags.add(name);
    save(); render(); refreshOut();
  }
  else if(e.target.classList.contains("reset")){
    delete edits[name];
    save(); render(); refreshOut();
  }
});

$("#list").addEventListener("input", e => {
  if(!e.target.classList.contains("try")) return;
  const li = e.target.closest("li"), name = li.dataset.n;
  const val = e.target.value;
  if(val === shipped(name)) delete edits[name]; else edits[name] = val;
  li.classList.toggle("edited", name in edits);
  // Light A/B and After up the moment the box says something other than the name.
  const live = comparable(name);
  li.querySelector(".ab").disabled = !live;
  li.querySelector(".after").disabled = !live;
  li.querySelector(".before").textContent = live ? "▶ Before" : "▶ Play";
  const note = li.querySelector(".same");
  if(note) note.hidden = live;
  save(); refreshOut();
});

$("#q").addEventListener("input", render);
$("#show").addEventListener("change", render);
$("#copy").addEventListener("click", async () => {
  try{ await navigator.clipboard.writeText($("#out").value); $("#copy").textContent = "Copied"; }
  catch(e){ $("#out").select(); $("#copy").textContent = "Select + copy"; }
  setTimeout(()=> $("#copy").textContent = "Copy list", 1400);
});
$("#clear").addEventListener("click", () => {
  if(!confirm("Clear every flag and edit?")) return;
  flags.clear(); edits = {}; save(); render(); refreshOut();
});

// Pull the roster and the override map straight out of the app.
$("#app").addEventListener("load", () => {
  const w = $("#app").contentWindow;
  try{
    // POKEMON and SPEECH_OVERRIDES are top-level `const`s, so they live in the
    // frame's lexical scope rather than on its window — eval reaches them.
    POKE = w.eval("POKEMON");
    OVERRIDES = w.eval("SPEECH_OVERRIDES");
    // Provenance lives in trailing comments on the map, which eval can't see —
    // read it out of the frame's own source instead.
    const src = w.document.documentElement.innerHTML;
    const blk = src.match(/const SPEECH_OVERRIDES = \{([\s\S]*?)\n\};/);
    if(blk) for(const m of blk[1].matchAll(/^\s*"?([a-z0-9-]+)"?:\s*"[^"]*",\s*\/\/\s*(\w+)/gm))
      PROV[m[1]] = m[2];
  }catch(err){
    $("#warn").hidden = false;
    $("#warn").textContent = "Couldn't read the roster from ../index.html — " + err.message
      + "  This page must be served over http:// rather than opened as a file.";
    return;
  }
  render();
  refreshOut();
});
</script>
</body>
</html>
